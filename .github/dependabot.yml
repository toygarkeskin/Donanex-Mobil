# Dependabot: güncelleme önerilerini haftalık çekme isteği olarak açar.
# Expo paketleri SDK'ya bağlı sürümlerde tutulmalı (npx expo install --check);
# Expo'nun kendi paketleri burada GÜNCELLENMİYOR, yanlış sürüme çekilmesin.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@expo/*"
      # Expo SDK'nın sabitlediği yerel modüller (npx expo install yönetir).
      - dependency-name: "@react-native-async-storage/*"
      # Ana sürüm atlamaları SDK ile birlikte yapılır; tek başına derlemeyi
      # bozuyor (TypeScript 7 ve ESLint 10 ilk denemede CI'da kırıldı).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
